version: "3.8"

services:
  maldonado-app:  
    image: ghcr.io/alejandromgt52/maldonado:1.0.5  
    
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.maldonado.entrypoints=http"
        - "traefik.http.routers.maldonado.rule=Host(`maldonado.byronrm.com`)"  
        - "traefik.http.middlewares.maldonado-httpsal.redirectscheme.scheme=https"
        - "traefik.http.routers.maldonado.middlewares=maldonado-httpsal"
        - "traefik.http.routers.maldonado-secure.entrypoints=https"
        - "traefik.http.routers.maldonado-secure.rule=Host(`maldonado.byronrm.com`)"
        - "traefik.http.routers.maldonado-secure.tls=true"
        - "traefik.http.routers.maldonado-secure.tls.certresolver=http"
        - "traefik.http.routers.maldonado-secure.service=maldonado"
        - "traefik.http.services.maldonado.loadbalancer.server.port=5000"  
        - "traefik.docker.network=traefik-public"
        
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true